name: OPOS Playwright Read-only Smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Dedicated Overflow Partner preview deployment URL (not production)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  readonly-smoke:
    name: Public routes and portal access safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test infrastructure must be explicitly designated before any browser run.
    if: ${{ vars.OPOS_E2E_TEST_ENV_READY == 'true' }}
    env:
      CI: 'true'
      OPOS_TEST_BASE_URL: ${{ inputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate isolated test target
        run: node -e "require('./tests/smoke/target.cjs').assertSafeTarget(process.env.OPOS_TEST_BASE_URL)"
      - name: Run non-destructive smoke tests
        run: npx playwright test --config playwright.config.cjs
      - name: Upload failed-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opos-playwright-smoke-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
