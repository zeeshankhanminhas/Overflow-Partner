name: OPOS Safe Playwright Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'playwright.config.mjs'
      - 'tests/smoke/**'
      - '.github/workflows/playwright-safe-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'playwright.config.mjs'
      - 'tests/smoke/**'
      - '.github/workflows/playwright-safe-smoke.yml'

permissions:
  contents: read

jobs:
  public-mobile-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Non-destructive public smoke tests
        run: npx playwright test --config=playwright.config.mjs
        env:
          OPOS_SMOKE_BASE_URL: https://overflow-partner.vercel.app
      - name: Upload reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opos-playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
