name: OP Browserbase Manual Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-only dependencies
        run: npm install --no-save --ignore-scripts @browserbasehq/sdk playwright-core
      - name: Open OP login in supervised cloud browser
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: node scripts/browserbase-production-session.mjs
