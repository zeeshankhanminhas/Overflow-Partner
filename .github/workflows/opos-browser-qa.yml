name: OPOS QA Browser Smoke (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/browser/**'
      - '.github/workflows/opos-browser-qa.yml'
      - 'app/login/**'
      - 'app/portal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opos-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: 'true'
      # Bootstrap default is a previously verified isolated-QA preview.
      # Configure repository variable OPOS_QA_BASE_URL to the current QA
      # deployment for ongoing coverage. This suite performs NO writes.
      OPOS_QA_BASE_URL: ${{ vars.OPOS_QA_BASE_URL || 'https://overflow-partner-lb8vfl6fv-zeeshankhanminhas-projects.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies without running install scripts
        run: npm ci --ignore-scripts
      - name: Install pinned Playwright test runner for browser QA
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.0
      - name: Install Chromium with Linux system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run read-only QA browser smoke
        run: npx playwright test --config=qa/browser/playwright.config.mjs
      - name: Upload failure screenshots, traces and HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: opos-anonymous-browser-report
          path: |
            playwright-report/
            qa/browser/playwright-report/
            test-results/
            qa/browser/test-results/
          retention-days: 7
          if-no-files-found: warn
