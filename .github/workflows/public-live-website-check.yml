name: OPOS Public Website Anonymous Health

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - '.github/workflows/public-live-website-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public pages, downloads and private workspace boundary (NO credentials or writes)
        env:
          BASE_URL: https://overflow-partner.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const base = process.env.BASE_URL;
          const results = [];
          const request = path => fetch(new URL(path, base), {
            method: 'GET', redirect: 'manual', cache: 'no-store',
            headers: { 'User-Agent':'OPOS-anonymous-readiness-check/1.0' },
            signal: AbortSignal.timeout(15000)
          });
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function retry(route, retries=5) {
            let lastError;
            for (let attempt=0; attempt<retries; attempt++) {
              try {
                const response = await request(route);
                if (response.status===200) return response;
                lastError = new Error(route+' returned HTTP '+response.status);
              } catch (error) { lastError=error; }
              if (attempt < retries - 1) await wait(4000);
            }
            throw lastError;
          }
          for (const route of ['/', '/contact', '/assurance', '/assurance/templates', '/login']) {
            const response=await retry(route);
            assert.match(response.headers.get('content-type')||'', /text\/html/i);
            const html=await response.text();
            assert.match(html, /Overflow Partner/i, 'Expected OPOS content at '+route);
            if (route === '/login') assert.match(html,/Sign In/i,'Login must have a Sign In heading');
            console.log('PASS anonymous website GET',route,'200');
            results.push('PASS '+route+' — HTTP 200, OPOS HTML');
          }
          for (const route of ['/api/public/capability-statement','/api/public/sample-handover']) {
            const response=await retry(route);
            assert.match(response.headers.get('content-type')||'', /application\/pdf/i);
            const bytes=new Uint8Array(await response.arrayBuffer());
            assert.equal(Buffer.from(bytes.subarray(0,5)).toString('ascii'),'%PDF-');
            console.log('PASS anonymous PDF',route,bytes.byteLength,'bytes');
            results.push('PASS '+route+' — HTTP 200 PDF');
          }
          const workspace=await request('/workspace');
          const raw=await workspace.text();
          assert.ok(!/What needs your attention\?|OPOS \/ HOME/.test(raw),
            'Private workspace data appeared in anonymous response');
          console.log('PASS anonymous workspace boundary; status',workspace.status);
          results.push('PASS /workspace — no private workspace content (HTTP '+workspace.status+')');
          if(process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Anonymous public website check\n\n'+results.map(x=>'- '+x).join('\n')+'\n\nThis check is read-only. Real enquiry/email delivery still requires separate verification.\n');
          console.log('OPOS website anonymous readiness',results.length+'/'+results.length,'checks passed');
          NODE
