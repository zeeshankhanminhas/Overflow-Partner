<svg xmlns="http://www.w3.org/2000/svg"
  width="360" height="180" viewBox="0 0 340 180"
  role="img" aria-labelledby="title desc">
  <title id="title">Overflow Partner symbol</title>
  <desc id="desc">OP monogram with a red lower extension representing additional engineering capacity.</desc>
  
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- O monogram -->
    <rect x="28" y="26" width="54" height="38" rx="8"
          stroke="#171717" stroke-width="10"/>
    <path d="M82 45H250" stroke="#171717" stroke-width="10"/>

    <!-- P monogram -->
    <path d="M58 82V144" stroke="#171717" stroke-width="10"/>
    <path d="M58 84H101C118 84 126 94 126 106C126 118 118 128 101 128H58"
          stroke="#171717" stroke-width="10"/>
    <path d="M126 128H240" stroke="#171717" stroke-width="10"/>
    <path d="M240 128H300" stroke="#E5483F" stroke-width="10"/>
  </g>

</svg>
