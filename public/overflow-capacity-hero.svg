<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Overflow Partner engineering capacity extension</title>
  <desc id="desc">A restrained industrial composition of structural rails and engineered guides extending into an orange capacity rail.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe6"/>
      <stop offset="1" stop-color="#ebe6dc"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#262826"/>
      <stop offset="0.46" stop-color="#8d8c85"/>
      <stop offset="1" stop-color="#3d403d"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b6ad"/>
      <stop offset="1" stop-color="#4d504d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#111" flood-opacity=".12"/>
    </filter>
  </defs>
